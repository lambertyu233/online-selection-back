server:
  port: 8500
spring:
  application:
    name: server-gateway    # 服务注册到Nacos时的名称
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        cors-configurations:
          '[/**]': # 匹配所有路径
            allowedOriginPatterns:     # 允许前端来源跨域地址
              - "http://localhost:3001"  # 后台管理系统前端
              - "http://localhost"      # 用户使用前端
            allowedHeaders: "*"        # 允许所有请求头
            allowedMethods: "*"        # 允许所有HTTP方法（GET/POST等）
            maxAge: 36000              # 预检请求缓存时间（秒）
            allowCredentials: true  # 若前端需要传递 Cookie
      routes:
        - id: service-product          # 路由ID（唯一标识）
          uri: lb://service-product    # 目标服务名（lb://表示负载均衡）
          predicates:
            - Path=/*/product/**       # 路径匹配规则
        - id: manager
          uri: lb://manager
          predicates:
            - Path=/admin/**